spring.application.name=midterm-catalog

# MySQL is the required final persistence target.
# Credentials come from environment variables so nothing secret is committed.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/infoman1_catalog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
